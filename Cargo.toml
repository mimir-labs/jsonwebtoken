[package]
name = "jsonwebtoken"
version = "9.3.0"
authors = ["Vincent Prouillet <hello@vincentprouillet.com>"]
license = "MIT"
readme = "README.md"
description = "Create and decode JWTs in a strongly typed way."
homepage = "https://github.com/Keats/jsonwebtoken"
repository = "https://github.com/Keats/jsonwebtoken"
keywords = ["jwt", "api", "token", "jwk"]
edition = "2021"
include = [
    "src/**/*",
    "benches/**/*",
    "tests/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]
rust-version = "1.73.0"

[dependencies]
serde_json = { version = "1.0", features = ["alloc"], default-features = false }
serde = { version = "1.0", features = ["derive", "alloc"], default-features = false }
base64 = { version = "0.21.0", features = ["alloc"], default-features = false }
# For PEM decoding
pem = { version = "3", optional = true }
simple_asn1 = { version = "0.6", optional = true }

# parity scale-codec support
parity-scale-codec = { version = "3.6.12", features = ["derive"], default-features = false, optional = true }
scale-info = { version = "2.11.6", features = ["derive"], default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring = { version = "0.17.4", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
ring = { version = "0.17.4", features = ["std", "wasm32_unknown_unknown_js"], optional = true}

[dev-dependencies]
wasm-bindgen-test = "0.3.1"

[target.'cfg(not(all(target_arch = "wasm32", not(any(target_os = "emscripten", target_os = "wasi")))))'.dev-dependencies]
# For the custom time example
time = "0.3"
criterion = "0.4"

[target.'cfg(all(target_arch = "wasm32", not(any(target_os = "emscripten", target_os = "wasi"))))'.dev-dependencies]
# For the custom time example
time = { version = "0.3", features = ["wasm-bindgen"] }
criterion = { version = "0.4", default-features = false }

[features]
default = ["use_pem", "std"]
use_pem = ["pem", "simple_asn1"]
crypto = ["validation"]
validation = []
wasm-js = [ "js-sys", "ring" ]
codec = ["parity-scale-codec", "scale-info"]
std = [
    "base64/std",
    "serde/default",
    "serde_json/std",
    "crypto",
]

[[bench]]
name = "jwt"
harness = false

[badges]
maintenance = { status = "passively-maintained" }
